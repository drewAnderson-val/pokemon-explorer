# Local Postgres for the API's development and tests. Prod is Cloud SQL, Postgres 17.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      # Dev uses this database; tests use `postgres` and wipe it, so they never touch dev data.
      POSTGRES_DB: pokemon
    ports:
      - '54329:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 2s
      timeout: 2s
      retries: 15
