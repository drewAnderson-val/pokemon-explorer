name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Workload Identity Federation
  pull-requests: write # Pulumi preview + preview-URL comments

env:
  PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
  PULUMI_CONFIG_PASSPHRASE: '' # no secrets in stack config
  PREVIEW_STACK: pr-${{ github.event.pull_request.number }}

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # The FastAPI service in api/: lint, types and tests against a real Postgres.
  check-api:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 15
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - run: pipx install uv==0.9.7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  # prod stack: `pulumi preview` on PRs (read-only), `pulumi up` on main.
  deploy:
    needs: [check, check-api]
    runs-on: ubuntu-latest
    # Deploys queue and never cancel mid-apply; PR previews of prod are read-only.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('prod-preview-{0}', github.ref) || 'prod-deploy' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      url: ${{ steps.pulumi.outputs.url }}
      api-url: ${{ steps.pulumi.outputs.apiUrl }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: infra
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: docker/setup-buildx-action@v4
      - uses: pulumi/actions@v7
        id: pulumi
        with:
          command: ${{ github.event_name == 'pull_request' && 'preview' || 'up' }}
          stack-name: prod
          upsert: true
          work-dir: infra
          comment-on-pr: true

  smoke-test:
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      URL: ${{ needs.deploy.outputs.url }}
      API_URL: ${{ needs.deploy.outputs.api-url }}
    steps:
      - name: Health check
        run: curl -fsS --retry 5 --retry-all-errors --retry-delay 3 "$URL/api/health"
      - name: SPA shell is served
        run: curl -fsS "$URL/" | grep -q '<div id="root">'
      - name: Deep links serve the app
        run: curl -fsS "$URL/team" | grep -q '<div id="root">'
      - name: A missing build file is a 404 that isn't cached
        run: |
          headers=$(curl -sS -o /dev/null -D - "$URL/assets/missing-file.js")
          echo "$headers" | grep -q '^HTTP/[0-9.]* 404'
          ! echo "$headers" | grep -qi immutable
      - name: Unknown API paths are a JSON 404 on the frontend
        run: |
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$URL/api/nope")" = 404
          curl -sS "$URL/api/nope" | jq -e '.error == "Not found"' >/dev/null
      # After the frontend's checks, so an API failure never hides them.
      - name: API health check (FastAPI, reaches the database)
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 "$API_URL/api/health" \
            | jq -e '.status == "ok"' >/dev/null
      - name: API returns paginated data
        run: |
          body=$(curl -fsS "$API_URL/api/pokemon?page=1&limit=5")
          echo "$body" | jq -e '(.data | length) == 5 and .pagination.total > 0' >/dev/null
      - name: API search filters results
        run: |
          curl -fsS "$API_URL/api/pokemon?search=fire&limit=50" \
            | jq -e '.data | length > 0 and all(.[]; (.types | index("Fire")) or (.name + .description | test("fire"; "i")))' >/dev/null
      # No smoke test creates a user: it would add a row to the prod database on every deploy.
      - name: API login rejects unknown users with the generic message
        run: |
          code=$(curl -sS -o /tmp/login.json -w '%{http_code}' -X POST "$API_URL/api/auth/login" \
            -H 'content-type: application/json' -d '{"username":"smoke_nobody","password":"not-a-password"}')
          test "$code" = 401
          jq -e '.error == "Wrong username or password"' /tmp/login.json >/dev/null
      - name: API /api/me needs a token
        run: test "$(curl -sS -o /dev/null -w '%{http_code}' "$API_URL/api/me")" = 401
      - name: API docs are served
        run: |
          curl -fsS "$API_URL/api/docs" | grep -qi swagger
          curl -fsS "$API_URL/api/openapi.json" | jq -e '.paths["/api/battles/wild/actions"].post.requestBody' >/dev/null
      # A browser on either of the frontend's Cloud Run URLs must be able to call the API.
      - name: API allows the frontend's origins (CORS)
        run: |
          for origin in "$URL" "https://pokemon-explorer-605570978921.us-central1.run.app"; do
            curl -sS -o /dev/null -D - -X OPTIONS "$API_URL/api/auth/signup" -H "Origin: $origin" \
              -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' \
              | grep -qi "^access-control-allow-origin: $origin" || { echo "CORS refused $origin"; exit 1; }
          done
      # No smoke test makes a creature: each one costs money and writes to prod.
      - name: API creatures need a token
        run: |
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$API_URL/api/creatures")" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$API_URL/api/creatures")" = 401
      - name: API friend matches need a token
        run: test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$API_URL/api/matches")" = 401
      - name: API team and battles need a token
        run: |
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$API_URL/api/team")" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$API_URL/api/battles/wild")" = 401
      - name: API allows the frontend origin (CORS)
        run: |
          curl -fsS -o /dev/null -D - -H "Origin: $URL" "$API_URL/api/health" \
            | grep -iqF "access-control-allow-origin: $URL"

  # Per-PR preview environment: its own Cloud Run service from the pr-<n> stack,
  # linked from a PR comment that's updated in place, destroyed when the PR closes.
  preview-env:
    needs: [check, check-api]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: preview-env-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: infra
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: docker/setup-buildx-action@v4
      - uses: pulumi/actions@v7
        id: pulumi
        with:
          command: up
          stack-name: ${{ env.PREVIEW_STACK }}
          upsert: true
          work-dir: infra
      - name: Health check
        run: curl -fsS --retry 5 --retry-all-errors --retry-delay 3 "${{ steps.pulumi.outputs.url }}/api/health"
      - name: Post preview link
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.pulumi.outputs.url }}
        run: |
          body=$(printf '<!-- preview-env -->\n### Preview environment\n\n**%s**\n\nDeployed from %s. Destroyed when this PR closes.' \
            "$URL" "${{ github.event.pull_request.head.sha }}")
          .github/scripts/upsert-pr-comment.sh "$body"

  preview-env-cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: preview-env-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: infra
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: pulumi/actions@v7
        with:
          command: destroy
          stack-name: ${{ env.PREVIEW_STACK }}
          upsert: true # PRs that never got a preview still close cleanly
          remove: true
          work-dir: infra
      - name: Update preview comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/upsert-pr-comment.sh "$(printf '<!-- preview-env -->\n### Preview environment\n\nDestroyed (PR closed).')"
