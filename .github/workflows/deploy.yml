name: Deploy

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'infra/**', '.github/workflows/deploy.yml']
  pull_request:
    paths: ['frontend/**', 'infra/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

# Previews for a PR cancel each other; deploys queue and never cancel mid-apply.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('preview-{0}', github.ref) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write # Workload Identity Federation
  pull-requests: write # Pulumi preview comment

env:
  PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
  PULUMI_CONFIG_PASSPHRASE: '' # no secrets in stack config

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  deploy:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.pulumi.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: infra
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: docker/setup-buildx-action@v4
      - uses: pulumi/actions@v7
        id: pulumi
        with:
          command: ${{ github.event_name == 'pull_request' && 'preview' || 'up' }}
          stack-name: prod
          upsert: true
          work-dir: infra
          comment-on-pr: true

  smoke-test:
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      URL: ${{ needs.deploy.outputs.url }}
    steps:
      - name: Health check
        run: curl -fsS --retry 5 --retry-all-errors --retry-delay 3 "$URL/api/health"
      - name: SPA shell is served
        run: curl -fsS "$URL/" | grep -q '<div id="root">'
      - name: API returns paginated data
        run: |
          body=$(curl -fsS "$URL/api/pokemon?page=1&limit=5")
          echo "$body" | jq -e '(.data | length) == 5 and .pagination.total > 0' >/dev/null
      - name: Search filters results
        run: |
          curl -fsS "$URL/api/pokemon?search=fire&limit=50" \
            | jq -e '.data | length > 0 and all(.[]; (.types | index("Fire")) or (.name + .description | test("fire"; "i")))' >/dev/null
