[project]
name = "pokemon-api"
version = "0.1.0"
description = "Pokemon Explorer API (FastAPI + Postgres)"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "google-cloud-storage>=3.17.1",
    "google-genai>=2.34.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pyjwt>=2.15.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["app", "scripts", "tests"]

# google-cloud-storage ships no type information.
[[tool.mypy.overrides]]
module = ["google.cloud", "google.cloud.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
